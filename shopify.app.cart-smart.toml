# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0859f7f7217d0f7402f7201130710a40"
name = "cart-smart"
application_url = "https://upsell-manager.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_script_tags,read_script_tags,write_products,read_products"

[app_proxy]
url = "https://upsell-manager.vercel.app/api/upsells"
subpath = "upsell"
prefix = "apps"

[auth]
redirect_urls = [
  "https://upsell-manager.vercel.app/auth/callback",
  "https://upsell-manager.vercel.app/auth/session/token"
]

